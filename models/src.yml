version: 2

sources:
  - name: oracle_erp
    database: ECOM_PROJECT        # change if needed
    schema: BRONZE_SCHEMA        # change if needed

    tables:
      - name: CUSTOMER_ORDERS_RAW_T
        description: "Raw customer orders data from Oracle ERP"

        columns:
          - name: CUSTOMER_ID
            description: "Unique customer identifier"
            tests:
              - not_null

          - name: ORDER_ID
            description: "Unique order identifier"
            tests:
              - not_null

          - name: ORDER_DATE
            description: "Date of the order"

          - name: ORDER_AMOUNT
            description: "Order amount"

        freshness:
          loaded_at_field: LOAD_TIMESTAMP
          warn_after: {count: 1, period: day}
          error_after: {count: 2, period: day}